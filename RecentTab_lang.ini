; RecentTab_lang.ini
; UI text for RecentTab, in one or more languages. Selected via
; Language= in RecentTab.ini (matches a section name here, case
; insensitive). Must sit in the same folder as the plugin file, same as
; RecentTab.ini.
;
; UTF-8 encoded (no BOM required, but one is fine if your editor adds
; it). This file is read by RecentTab's own parser, not by Total
; Commander or Windows' GetPrivateProfileString - so it does not follow
; the "needs a UTF-16LE BOM for Unicode" rule that applies to regular
; Windows .ini files in general. Save it as UTF-8 and it will just work,
; including for scripts a plain ANSI codepage can't represent at all
; (Cyrillic, Greek, etc.) - see Color_ini_example.ini for a worked
; Cyrillic example you can copy a [xyz] section from into here.
;
; Any key left out of a section, or left blank, falls back to English
; automatically - a partial translation never looks broken, it just
; shows English for whatever wasn't translated yet.
;
; ";" only works as a comment at the very start of a line - there is no
; inline/trailing comment syntax, to avoid ambiguity with translated
; text that legitimately contains a semicolon.

