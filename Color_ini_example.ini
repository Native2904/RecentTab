; Color_ini_example.ini
; ------------------------------------------------------------------
; Worked example: adding a Cyrillic (Russian) translation to
; RecentTab's language file. NOT loaded automatically - this is a
; template to copy from, not a file the plugin reads on its own.
;
; Why Cyrillic specifically, as the proof that the UTF-8 parser
; actually works: a wrong-codepage mistake with German umlauts can
; still look "close enough" to pass a casual glance. A wrong-codepage
; mistake with Cyrillic doesn't degrade gracefully at all - it turns
; into complete mojibake immediately, with no way to misread it as
; "probably fine". That makes it the right script to test against,
; not just a random third language.
;
; To actually use this:
;   1. Copy the [rus] section below into RecentTab_lang.ini (in the
;      same folder as RecentTab.ini and the plugin file).
;   2. Set Language=rus in RecentTab.ini's [Settings] section.
;   3. Save RecentTab_lang.ini as UTF-8 (no special BOM handling
;      needed either way - the parser checks for one but doesn't
;      require it).
;
; Same rules as RecentTab_lang.ini: any key left out or left blank
; falls back to English automatically, and ";" only comments out a
; whole line, never part of one.
; ------------------------------------------------------------------

[rus]
; --- Записи на панели ("! ..."-псевдозаписи) ---
PanelRecPrefix=! ЗАП
PanelRecOff=ВЫКЛ
PanelResetEntry=! Сбросить историю
PanelRefreshEntry=! Обновить сейчас

; --- Диалог подтверждения сброса ---
