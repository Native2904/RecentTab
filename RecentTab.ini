; RecentTab.ini
; Default settings are fine for regular use - nothing here needs editing
; to get started.
;
; Laid out in three groups, in this order: (1) all the plain function
; switches, (2) colors, (3) paths - so anything machine-specific (your
; own folders, your own icon files) sits clearly apart from everything
; that's just a preference and safe to copy/share as-is.

; ============================================================
; 1) Function switches
; ============================================================

[Settings]
ConfirmReset=1
SortDescending=1

; Writes a timestamped line to RecentTab_debug.log next to this file
; for nearly every operation - real disk I/O on every call, not free,
; and the file is never rotated/truncated, so it grows without limit
; over long-term use. Left on (1) here deliberately while you're still
; testing - it's the main way to diagnose anything that looks wrong.
;
; IMPORTANT before sharing a build with anyone else: change this to 0.
; A silently-growing log file by default is a reasonable default for
; YOUR testing, but not for someone who just wants to use the plugin -
; they should only turn logging on if you ask them to, e.g. to help
; track down a bug report. No rebuild needed either way - takes effect
; on the next TC restart (checked once per session, the first time
; logging is needed).
DebugLogging=1

; UI language - matches a section name in RecentTab_lang.ini (case
; insensitive). Ships with "eng" and "deu"; any missing/blank key in
; the chosen section falls back to English automatically, so a partial
; translation never looks broken.
Language=eng

; By default, any [Watched:...] block further down (see group 3, Paths)
; replaces the six default folders (Desktop/Documents/Downloads/
; Pictures/Videos/Music) entirely, rather than adding to them. Set this
; to 1 to add your custom [Watched:...] blocks to the six defaults
; instead of replacing them.
;IncludeDefaultFolders=0

; Which of "! Reset history", "! Refresh now", "! Search",
; "! Auto-Refresh" and "! Reset sort order" show directly at the top
; level instead of tucked inside "! menu" (where all five live by
; default). Semicolon-separated, any combination of:
; Reset;Refresh;Search;AutoRefresh;SortReset - e.g. RootButtons=Refresh
; puts "! Refresh now" at the top alongside "! menu" and "! REC", while
; the rest stay inside. If all five are listed, "! menu" itself won't
; appear at all (nothing left to put in it).
;RootButtons=

; 0 = hide "! Search" entirely - no entry for it anywhere, not at root,
; not inside "! menu". For anyone who'd rather not have it available
; at all.
UseSearch=1

; 0 = stop the Alt+Enter dialog's title bar from ticking once a second -
; the title stays static instead. Purely cosmetic, no functional effect.
ShowLiveClock=1

; File-extension filtering. OnlyExtensions= is global (applies across
; all watched folders) and semicolon-separated, accepts "exe", "*.exe",
; or ".exe" - however you naturally type it. If set at all, it takes
; absolute priority - only files matching one of these are shown,
; overriding every ExcludeExtensions= (this one or any per-folder one
; in group 3 below) entirely while it's active.
;OnlyExtensions=docx;pdf;jpg

; Per-folder file-extension exclusions live in each [Watched:Name]
; block now (see group 3, Paths) rather than here - a single global
; ExcludeExtensions= couldn't tell two differently-purposed folders
; apart. See the ExcludeExtensions= example under [Watched:Projects]
; below.

; Six optional extra columns, each off by default - turn on only the
; ones you actually want. Add them afterward via Total Commander's own
; Shift+F1 "Configure custom columns".
;ShowChangeType=0    ; "Changed" or "New" - which one actually got the file into the list
;ShowRelativeTime=0  ; "5 minutes ago" alongside the normal date
;ShowSourceFolder=0  ; which [Watched:Name] block matched - useful with several configured
;ShowSession=0       ; which numbered recording session (the "#N" next to "! REC") a file came from
;ShowOpened=0        ; "x" if you've already opened this file through the panel before
;ShowLocked=0        ; "Access"/"Locked"/"Not found" - is another program currently holding the file?

; Only relevant if ShowOpened=1 above. "session" (default) forgets
; again on TC restart; "permanent" remembers across restarts, in its
; own small text file (RecentTab_opened.txt) - kept separate from the
; main state file on purpose, easy to delete on its own if you want a
; clean slate.
;OpenedTracking=session

; Only relevant if ShowLocked=1 above. The check itself opens every
; listed file to test whether it's free - genuinely touches the file
; (updates its last-access time, can wake antivirus/cloud sync), and on
; a network drive it's a real round-trip per file, not a local check.
; Runs on a background thread either way, so the panel itself never
; waits on it - but these three switches control which drive types get
; checked automatically at all. Local/fixed drives are always checked;
; network, removable, and optical media are off by default, each
; individually re-enabled here if you actually want it.
;AllowDriveNetwork=0
;AllowDriveRemovable=0
;AllowDriveCDRom=0

; 0 = ignore every theme below entirely and use plain system colors
; instead, everywhere (Alt+Enter dialog, search window, and Menu.exe
; once it exists) - for anyone who'd rather not have any of it.
NoColors=0

; Auto-Refresh: the panel re-reads itself automatically instead of
; needing Strg+R. Off by default - fully opt-in, no behavior change
; unless you turn it on. Can also be toggled/changed at runtime via the
; "! Auto-Refresh" entry in "! menu" (or at root, via RootButtons=
; below) - that's session-only though, this is just the startup value.
;AutoRefresh=0
;AutoRefreshIntervalSec=600   ; enforced minimum of 3s regardless of what's set here

; All four optional and independent - only relevant if AutoRefresh=1
; above. Each is its own yes/no gate, checked before every automatic
; tick; none of them affect each other.
;AutoRefreshMaxIdleMin=0      ; 0 = disabled; otherwise skip auto-refresh once the system has been unused this long (GetLastInputInfo)

; Fine-tune the loaded theme's brightness without picking new colors -
; fixed steps rather than a free number, see the Helligkeitsregler
; handbrief for why. FontBrightness shifts every text color, Background-
; Brightness shifts only the background - both -3 to +3, 0 = unchanged.
; If a combination of the two would leave too little contrast between
; background and text, both are silently ignored and a warning appears
; in the Alt+Enter dialog instead of a barely-readable result.
;FontBrightness=0
;BackgroundBrightness=0

; Monospace font for the search window's FROM/TO fields. Two fonts ship
; with this plugin (fonts\ folder, both SIL Open Font License) - loaded
; privately for this process only (no system install, no admin rights
; needed), so they show up identically everywhere regardless of what's
; installed on the machine. Default is JetBrains Mono; to switch to Fira
; Code instead, use the second pair below. MonoFont= is the file path,
; MonoFontName= is the font's own internal family name - these are two
; different things and both must be correct together, or Windows
; silently falls back to a substitute font with no error. To use
; Cascadia Code instead (no download needed - Windows already ships it),
; leave MonoFont= blank and set MonoFontName=Cascadia Code.
MonoFont=fonts\JetBrainsMono-Regular.ttf
MonoFontName=JetBrains Mono
;MonoFont=fonts\FiraCode-Regular.ttf
;MonoFontName=Fira Code

; ============================================================
; 2) Colors
; ============================================================

; Color theme, shared by the Alt+Enter dialog, the search window, and
; Menu.exe once it exists - all read the same [Theme] section. One of:
; basic (default) / gruvbox / everforest / solarized / custom
; Each of the four named presets comes in both a light and dark variant
; - Dracula/Monokai aren't offered as presets here since neither has an
; official light counterpart to pair with the other three; use custom
; below for a Dracula/Monokai-like look instead.
[Theme]
Name=basic
Mode=dark              ; dark (default) / light - applies to Name above

; 1 = Mode= above is ignored, and light/dark is instead decided by the
; current hour (0-23) - e.g. the defaults mean "light" from 6:00 to
; 17:59, "dark" the rest of the time. Re-evaluated fresh every time a
; window opens, so the switch takes effect live, no restart needed.
;TimeBasedMode=0
;LightStartHour=6
;DarkStartHour=18

; Only used when Name=custom above. Any line left blank or removed falls
; back to the matching basic value (for whichever Mode is set), so a
; partial custom theme never looks broken - just partly basic. Format:
; #RRGGBB.
;Background=#2b2a27
;Foreground=#ede0ce
;Heading=#d68f41
;Green=#39b81f
;Accent2=#00a8c6
;Yellow=#ebb626
;Accent4=#d63131
;Muted=#7a7267

; ============================================================
; 3) Paths
; ============================================================
; Everything below is inherently specific to this machine - your own
; folders, your own icon files. Kept separate from the switches above
; on purpose, so those can be copied/shared as-is without dragging your
; personal paths along with them.

; Restrict scanning to specific folders instead of the default (Desktop,
; Documents, Downloads, Pictures, Videos, Music - resolved via Windows'
; Known Folder API, so this also works correctly if e.g. OneDrive has
; redirected one of them). If at least one [Watched:...] block below is
; uncommented, only these folders are searched - the six defaults above
; are then ignored entirely, not merged with your custom list, UNLESS
; IncludeDefaultFolders=1 is set in [Settings] above.
;[Watched:Desktop]
;Path=%USERPROFILE%\Desktop

;[Watched:Documents]
;Path=%USERPROFILE%\Documents

;[Watched:Projects]
;Path=D:\Projects
;Exclude=Backup;node_modules
;ExcludeExtensions=exe;dll

; Custom icons for the panel entries, one key each - all optional, all
; fall back safely to a sensible default if left blank or if the file/
; index given doesn't actually produce an icon. Two accepted formats:
;   shell32,<index>     - an icon from Windows' own shell32.dll
;   <path>[,<index>]    - your own .ico/.exe/.dll; a relative path like
;                          "icons\age.ico" (used below) is resolved
;                          against this ini's own folder, no full path
;                          needed
;
; All seven below ship with a matching custom icon (icons\ folder) -
; same orange-ring, blue-symbol family throughout, each shape reflecting
; what its entry actually does. Point any of them at your own file
; instead if you'd rather.
[Icons]
RecIcon=icons\rec.ico
ResetIcon=icons\reset.ico
RefreshIcon=icons\refresh.ico
MenuIcon=icons\menu.ico
AgeIcon=icons\age.ico
BackIcon=icons\back.ico
AutoRefreshIcon=icons\autorefresh.ico
; Deliberately the same file as ResetIcon above - "revert to default"
; is the same underlying idea whether it's the recording history or
; just the panel's sort order.
SortResetIcon=icons\reset.ico
